# decode_heavy — stresses the decode phase with short input, long output (inference-perf)
# Fields marked "# auto" are overwritten by bench-init from target_env.
# All other fields are user-controlled and never modified automatically.

harness: inference-perf

load:
  type: constant
  stages:
    - rate: 1
      duration: 120
    - rate: 2
      duration: 120
    - rate: 4
      duration: 120
    - rate: 8
      duration: 120
  request_timeout: 120
  num_workers: 16

api:
  type: completion
  streaming: true

server:
  type: vllm
  model_name:  # auto
  base_url:    # auto
  ignore_eos: true

tokenizer:
  pretrained_model_name_or_path:  # auto

data:
  type: random
  input_distribution:
    min: 128
    max: 512
    mean: 256
    std_dev: 64
    total_count: 1000
  output_distribution:
    min: 1024
    max: 4096
    mean: 2048
    std_dev: 512
    total_count: 1000

report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false

storage:
  local_storage:
    path: /requests
