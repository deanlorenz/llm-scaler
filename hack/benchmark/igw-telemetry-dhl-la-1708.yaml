apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: llm-d-inference-gateway-telemetry
  namespace: dhl-la-1708
spec:
  # Target only the inference gateway pod, not all pods in the namespace.
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-d-inference-gateway
  accessLogging:
  - providers:
    - name: envoy
