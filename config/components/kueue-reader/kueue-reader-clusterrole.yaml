apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kueue-reader-role
rules:
# Cohorts are listed to tell a flat cohort from a nested one, for borrowing.
# Denied, borrowing reads hierarchy-unknown; the nominal bound is unaffected.
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - clusterqueues
  - cohorts
  - resourceflavors
  verbs:
  - get
  - list
# Namespace labels, to evaluate a ClusterQueue spec.namespaceSelector before its
# grant is attributed to a namespace. get only: one read per namespace whose
# queue has a non-empty selector, never a list or watch.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# Workloads and LocalQueues of every namespace, for Kueue cohort borrowing: a
# lender waiting in another namespace must stop new borrowing, and a
# LowerPriority lender is judged by its Workloads' priorities. Read whatever
# the install's scope; a namespace-scoped controller watches Workloads through
# a cluster-wide informer of its own. Denied, borrowing is withheld as
# lenders-unreadable; the nominal bound is unaffected. Kept after the
# namespaces rule: the installer patches rules/1 by index.
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - workloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - localqueues
  verbs:
  - get
  - list
