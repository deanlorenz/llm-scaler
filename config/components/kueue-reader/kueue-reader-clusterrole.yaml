apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kueue-reader-role
rules:
# Cohorts are listed to tell a flat cohort from a nested one, for borrowing.
# Denied, borrowing reads hierarchy-unknown; the nominal bound is unaffected.
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - clusterqueues
  - cohorts
  - resourceflavors
  verbs:
  - get
  - list
# Namespace labels, to evaluate a ClusterQueue spec.namespaceSelector before its
# grant is attributed to a namespace. get only: one read per namespace whose
# queue has a non-empty selector, never a list or watch.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# Not here: Workloads and LocalQueues of every namespace, which counting cohort
# borrowing reads. That read reaches every tenant's Workloads, so it is its own
# ClusterRole, granted by the installer only to a controller whose policy
# counts borrowing (pl_grant_kueue_borrow_read in deploy/lib/physical_limiter.sh).
# The installer patches rules/1 (namespaces) by index.
