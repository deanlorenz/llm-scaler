apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controller-manager-alerts
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-variant-autoscaler
    release: kube-prometheus-stack
spec:
  groups:
  - name: wva.rules
    rules:
    - alert: WVAHighErrorRate
      expr: sum by (component, error_type) (rate(wva_errors_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/monitoring.md#the-logs"
        summary: "llm-scaling-manager error rate elevated in {{ $labels.component }}"
        description: "Controller component '{{ $labels.component }}' error_type '{{ $labels.error_type }}' rate is {{ $value | printf \"%.2f\" }}/sec (>6/min threshold) sustained for 5+ minutes. Check controller logs for error patterns."

    - alert: WVAOptimizationLoopStalled
      expr: max_over_time(wva_models_processed[10m]) == 0 or absent_over_time(wva_models_processed[10m])
      for: 15m
      labels:
        severity: info
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-controller-is-not-ready-or-crash-looping"
        summary: "llm-scaling-manager has processed zero models for 15+ minutes"
        description: "wva_models_processed has been 0 (or absent) over a 10-minute window, sustained for 15+ minutes. This is EXPECTED when no variants are being managed (an idle controller). If you do have managed workloads, it can indicate the optimization loop is stalled/crashed or metric collection is failing — check controller pod status and logs, and Prometheus connectivity."

    - alert: WVAMetricsCollectionFailing
      expr: sum by (query_type, reason) (rate(wva_metrics_collection_errors_total[5m])) > 0.0833
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#metrics-stale-or-missing"
        summary: "llm-scaling-manager metrics collection failing for {{ $labels.query_type }}"
        description: "Metrics collection query_type '{{ $labels.query_type }}' failing with reason '{{ $labels.reason }}' at {{ $value | printf \"%.2f\" }}/sec (>5/min threshold) sustained for 5+ minutes. Scaling decisions may be based on stale data. Verify Prometheus/metrics endpoint connectivity."

    - alert: WVAPolicyNamespaceUnverified
      expr: max by (namespace) (wva_policy_namespace_unverified) == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#cluster-policy-is-not-applied-policy-namespace-unverified"
        summary: "llm-scaling-manager in {{ $labels.namespace }} cannot see the cluster policy namespace"
        description: "The controller in {{ $labels.namespace }} was denied get on the Namespaces that decide where its limiters and quotas come from (the wva-policy namespace, or a wva.llmd.ai/policy-namespace label), so it runs on its own ConfigMap. A cluster policy an admin published is NOT applied to it, and it may be scaling under a weaker bound than the admin believes is in force. Grouped by namespace, not exported_namespace: this is a controller-level gauge with no model namespace, so the scrape's namespace label is the controller's own. Fix: have a cluster admin re-run 'NAMESPACE=<ns> make setup-prereqs', which grants the Namespace get (components/policy-namespace-reader). The value is set once at startup, so restart the controller after the grant."

    - alert: WVANodeAccessDenied
      expr: wva_node_access_denied == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#the-controller-is-not-ready-or-crash-looping"
        summary: "llm-scaling-manager has a GPU limiter configured but cannot read nodes"
        description: "A gpu-inventory limiter is declared in the scaling-policy ConfigMap, and this controller's ServiceAccount is denied list on nodes. Every variant is therefore charged to no accelerator pool, receives no GPU budget, and HAS STOPPED SCALING UP — with no other error, because an unresolved accelerator is a normal state when no limiter is configured. This usually follows an admin adding a limiters: entry to a controller that was installed without node permission. Either grant the node read to the controller's ServiceAccount, or remove the limiters: entry."

    - alert: WVAGPUResourceExhausted
      expr: wva_available_gpus == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#gpus-held-or-quota-spent"
        summary: "GPU-labeled {{ $labels.accelerator_type }} nodes report zero allocatable accelerators"
        description: "The controller sees zero allocatable {{ $labels.accelerator_vendor }} {{ $labels.accelerator_model }} ({{ $labels.accelerator_type }}) GPUs for 5+ minutes. Note: this reflects node *allocatable* capacity (not free/schedulable GPUs), and wva_available_gpus is only emitted when a gpu-inventory limiter is declared in the scaling-policy ConfigMap's limiters: list. A GPU-labeled node advertising zero allocatable accelerators usually means it is NotReady or its device plugin/driver is not installed — check GPU node status and device-plugin pods."

    - alert: WVAReplicaScalingThrashing
      expr: sum by (exported_namespace, variant_name) (rate(wva_replica_scaling_total[10m])) > 0.033
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-is-flapping"
        summary: "llm-scaling-manager scaling thrashing detected for {{ $labels.exported_namespace }}/{{ $labels.variant_name }}"
        description: "Variant {{ $labels.exported_namespace }}/{{ $labels.variant_name }} scaling at {{ $value | printf \"%.3f\" }}/sec (>2/min threshold) sustained for 10+ minutes, indicating possible thrashing. Review scaling thresholds and consider adjusting stabilization window or thresholds."

    - alert: WVAModelWillNotScaleToZero
      expr: wva_model_scaling_blocked{reason=~"variant-floor|policy-forbids-zero"} == 1
      for: 15m
      labels:
        severity: info
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/guides/scale-to-zero/README.md#when-a-model-will-not-park"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} cannot reach zero ({{ $labels.reason }})"
        description: "Half of this model's configuration asks it to park and the other half forbids it, so it never will. reason 'variant-floor': scale-to-zero is enabled, but a variant declares minReplicas > 0 — a model is at zero only when nothing serves it, so that one floor keeps the whole model up and the accelerators are billed indefinitely. reason 'policy-forbids-zero': every variant permits zero, but scale-to-zero is disabled by the model's resolved scaling policy or by a tier one of its variants names, so the bounds are inert; most misleading with a single variant, where minReplicas: 0 reads exactly like a deliberate request to park. The controller log line 'Scale-to-zero is disabled by the scaling policy of a tier' lists the tiers (disabledBy); enable scaleToZero on each, or on the model's per-model entry. Neither is an error and neither breaks serving — which is why nothing else reports them: the model is up and healthy, exactly as every other metric says it should be. Either set every variant's minReplicas to 0, or disable scale-to-zero for the model, so the configuration says what it does."

    - alert: WVAModelHasNoWakeSignal
      expr: wva_model_scaling_blocked{reason="no-wake-signal"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-will-not-wake-from-zero"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} has no wake signal"
        description: "EPP is exporting no flow-control queue metric at all for this model, so a request arriving while it is parked has nothing that can wake it. This is the ABSENCE of the metric family, not a queue reading zero — an idle queue reports 0 and is healthy. The usual cause is an EPP pod older than the ConfigMap that enabled the flowControl feature gate: EPP reads --config-file once at startup, so enabling the gate does not reach a process already running, and every artifact (image digest, ConfigMap, feature gate, auth) still matches. Check the EPP pod's own startup log for the config it parsed rather than comparing it to the ConfigMap, then restart the EPP deployment. Until this clears, a model that scales to zero will stay there."

# There is deliberately NO alert on reason="engine-unsupported". It means one
# model is served by BOTH vLLM and SGLang, so no single request counter measures
# its idleness and it is never parked (vLLM alone and SGLang alone are each
# supported). That is a standing property of how the model is deployed, not an
# event: it would fire on the day the model is deployed and never clear, and an
# alert that is always firing is one operators learn to route to /dev/null --
# taking the two alerts above with it. The reason is still on the metric and on
# the operational dashboard, which is where a permanent condition belongs.

    # The SLO alerts. Notes for whoever edits them; the operator's runbook is
    # in troubleshooting.md.
    # - Counted over judged minutes, never bridged with last_over_time: an
    #   excluded window has no observed series, and on a whole-node model one
    #   exclusion outlasts any range that would be safe. A fixed count of
    #   wall-clock minutes never fires for a fleet that keeps scaling up while
    #   it misses, which is when misses happen.
    # - max by () on each side of every join: a restarted controller's series
    #   overlap the new one's, and a many-to-many join errors at evaluation.
    # - changes(wva_slo_window_requests[5m]) gates on the analyzer still
    #   publishing, so series frozen after it stopped cannot fire.
    # - The replicas gate reads max_over_time over 5m: on a restart or a
    #   leader change the old pod's series go stale at once, and an instant
    #   read is empty until the new leader publishes, which resolved every
    #   firing alert and fired it again. The price: a model that parks while
    #   the alert fires keeps it up for up to those 5 minutes.
    # - test/alerts/testdata/slo-alerts.test.yaml pins each of these.
    - alert: WVAModelSLOMissed
      expr: (count_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds) > on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds))[30m:1m]) / on (exported_namespace, model_name, objective, statistic) count_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds)[30m:1m]) >= 0.5) and on (exported_namespace, model_name, objective, statistic) count_over_time((max by (exported_namespace, model_name, objective, statistic) (wva_slo_observed_seconds) > on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds))[30m:1m]) >= 5 and on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (changes(wva_slo_window_requests[5m])) > 0 and on (exported_namespace, model_name) sum by (exported_namespace, model_name) (max_over_time(wva_model_replicas[5m])) > 0
      for: 2m
      labels:
        severity: warning
        # Observe only on this release: route on this label to a ticket queue
        # rather than a page if a tuning finding should not wake anyone.
        component: slo
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-misses-or-is-never-judged-against-its-slo"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} missed its {{ $labels.objective }} SLO ({{ $labels.statistic }}) in {{ $value | humanizePercentage }} of judged minutes"
        description: "In the last 30 minutes the router-measured {{ $labels.objective }} {{ $labels.statistic }} was over target in at least half of the judged minutes, and in at least 5. Minutes around a wake or a starting replica are not judged and count neither way. Only completed requests count, so under shedding the alert can clear while requests fail: read llm_d_epp_request_error_total. On this release the analyzer only observes: the fleet the tier sizes misses the SLO; the autoscaler did not fail. First check the target can be met at all (the runbook says how); if it can, raise the floor or lower scaleUpThreshold. Resolves once judged minutes that meet the target outnumber the misses."

    # Fires only when there is something to act on: the fleet was excluded for
    # at least half the hour (it never holds still), the router's series are
    # missing for the objective, or TPOT got no requests while the router
    # served streaming requests (clients without include_usage). That last
    # reads the router's own counter, not the TTFT objective, so a policy with
    # a TPOT target alone is covered. Too little traffic -- a quiet model, a
    # diurnal lull -- is not judged and does not fire this.
    # "Set for the hour" is 55 of the hour's minutes, not 60: Prometheus 3
    # ranges are left-open (60 samples, not 61), so 60 failed on any gap in
    # the series, and a restart leaves one of two minutes.
    - alert: WVAModelSLOUnjudged
      expr: (max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds) unless on (exported_namespace, model_name, objective, statistic) max by (exported_namespace, model_name, objective, statistic) (last_over_time(wva_slo_observed_seconds[1h]))) and on (exported_namespace, model_name, objective, statistic) count_over_time(max by (exported_namespace, model_name, objective, statistic) (wva_slo_target_seconds)[1h:1m]) >= 55 and on (exported_namespace, model_name, objective) (avg_over_time(max by (exported_namespace, model_name, objective) (wva_slo_excluded)[1h:1m]) >= 0.5 or (max by (exported_namespace, model_name, objective) (wva_slo_target_seconds) unless on (exported_namespace, model_name, objective) max by (exported_namespace, model_name, objective) (last_over_time(wva_slo_window_requests[1h]))) or (max by (exported_namespace, model_name, objective) (max_over_time(wva_slo_window_requests{objective="tpot"}[1h])) == 0 and on (exported_namespace, model_name) max by (exported_namespace, model_name) (label_replace(label_replace(increase(llm_d_epp_request_ttft_seconds_count{streaming="true"}[1h]), "model_name", "$1", "target_model_name", "(.+)"), "exported_namespace", "$1", "namespace", "(.*)")) > 0)) and on (exported_namespace, model_name) sum by (exported_namespace, model_name) (max_over_time(wva_model_replicas[5m])) > 0
      for: 15m
      labels:
        severity: info
        component: slo
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-misses-or-is-never-judged-against-its-slo"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} has had no judged {{ $labels.objective }} window for an hour"
        description: "The model's policy has set a {{ $labels.objective }} target for 55 of the last 60 minutes and the model has replicas, but no window was judged in it, and not for lack of traffic: either the fleet was excluded for at least half of it, never holding still for a window plus its grace (wva_slo_excluded says why), or the router's series for the objective are missing (router not scraped, not in the model's namespace, or clients not streaming), or TPOT saw no requests while the router served streaming requests (clients do not send stream_options.include_usage, or the router does not publish its TPOT series). The runbook has a table of each case."

    - alert: WVAModelParkedWhileRequestsRefused
      expr: (sum by (exported_namespace, model_name) (wva_model_replicas) == 0) and on (model_name) (sum by (model_name) (rate(llm_d_epp_request_error_total{error_code="ServiceUnavailable"}[5m])) > 0)
      for: 5m
      labels:
        severity: critical
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#a-model-will-not-wake-from-zero"
        summary: "Model {{ $labels.exported_namespace }}/{{ $labels.model_name }} is at zero replicas while requests are being refused"
        description: "Grouped by exported_namespace, not namespace: Prometheus renames a scraped `namespace` label to `exported_namespace` because the scrape job already carries one, so plain `namespace` here is the CONTROLLER's namespace and would name the wrong place. Nothing is serving this model and EPP is returning ServiceUnavailable for it, so traffic is being dropped and the autoscaler has not brought it back. This alerts on the SYMPTOM, so it fires whatever the cause: no wake signal (see WVAModelHasNoWakeSignal, which names that specific cause), an EPP that cannot be scraped, KEDA not delivering the activation, an admission or quota refusal on the scale-up, or a bug. Start with wva_model_scaling_blocked for this model — if a reason is present it is the likely cause. Note the join is on model_name alone because EPP's metrics carry no namespace, so two namespaces serving the same modelID cannot be told apart here; the namespace shown comes from the controller's side."

    - alert: WVAScalerTargetsUndecided
      expr: max by (exported_namespace) (wva_scaler_undecided_targets) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        runbook_url: "https://github.com/ev-shindin/llm-scaling-manager/blob/main/docs/reference/troubleshooting.md#scaledobject-ready-false-or-targets-unknown"
        summary: "{{ $value }} ScaledObject(s) in {{ $labels.exported_namespace }} have had no usable scaling decision for 10 minutes"
        description: "Grouped by exported_namespace, not namespace: the gauge carries the ScaledObject's namespace, which Prometheus renames to exported_namespace because the scrape job already has a namespace label (the controller's). The KEDA external scaler is answering these ScaledObjects with the target's current replica count because no engine has a usable decision for them, so their replica counts are frozen: they neither scale up under load nor down when idle. For a cycle or two after a controller restart or leader change this is expected; ten minutes is not. wva_scaler_undecided_answers_total says why: reason not-managed, or no-decision that never stops, means the model is never planned, usually a trigger metadata value that does not parse; stale means its decision stopped being republished, so read that model's scaling-decision lines. The controller log line 'external scaler has no decision for this target' names each ScaledObject."
