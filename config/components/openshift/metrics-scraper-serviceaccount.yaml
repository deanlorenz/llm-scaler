# The identity the user-workload Prometheus scrapes the controller's /metrics
# with. It holds ONE grant: `get` on the /metrics non-resource URL, through the
# metrics-reader ClusterRoleBinding this component points at it. It used to be
# the controller's own ServiceAccount, so the non-expiring token below was the
# controller's whole identity: cluster-wide pod writes and monitoring reads for
# anyone who could read Secrets in this namespace, and for every Prometheus admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-scraper
  labels:
    app.kubernetes.io/name: workload-variant-autoscaler
