# A legacy, non-expiring token for the metrics-scraper ServiceAccount, which the
# ServiceMonitor references as its bearerTokenSecret: the prometheus-operator can
# only read a Secret, not request a bound token. It grants `get /metrics` and
# nothing else. Rotate it by deleting the Secret and re-running the prereqs phase.
apiVersion: v1
kind: Secret
metadata:
  name: metrics-scraper-token
  labels:
    app.kubernetes.io/name: workload-variant-autoscaler
  annotations:
    kubernetes.io/service-account.name: metrics-scraper
type: kubernetes.io/service-account-token
