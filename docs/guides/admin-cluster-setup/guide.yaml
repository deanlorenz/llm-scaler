name: admin-cluster-setup

prerequisites:
  namespace:
    note: The namespace you are preparing. It must already run llm-d.
    run: export NAMESPACE=team-a
  check:
    note: Read-only. Checks the namespace, monitoring and the EPP.
    run: make check-prereqs

deploy:
  prereqs:
    run: make setup-prereqs
  out_of_reach:
    note: Run the controller in wva-NAMESPACE, which you own, managing NAMESPACE.
    run: |
      make setup-prereqs   WVA_NS=wva-${NAMESPACE} WVA_WATCH_NS=${NAMESPACE}
      make deploy-wva      WVA_NS=wva-${NAMESPACE} WVA_WATCH_NS=${NAMESPACE}
  gpu_quota:
    note: Cap the namespace's GPUs at admission. Size it to the tenant's entitlement.
    run: |
      kubectl -n ${NAMESPACE} create quota wva-gpus --hard=requests.nvidia.com/gpu=8
      kubectl -n ${NAMESPACE} describe quota wva-gpus
  namespace_read:
    note: Grant the Namespace read and the wva-policy read by hand, then restart the controller.
    run: |
      kubectl apply -f - <<EOF
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: wva-namespace-reader-${NAMESPACE}
      rules:
      - apiGroups: [""]
        resources: ["namespaces"]
        resourceNames: ["${NAMESPACE}", "wva-policy"]
        verbs: ["get"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: wva-namespace-reader-${NAMESPACE}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: wva-namespace-reader-${NAMESPACE}
      subjects:
      - kind: ServiceAccount
        name: wva-controller-manager
        namespace: ${NAMESPACE}
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: wva-policy-reader
        namespace: wva-policy
      rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: wva-policy-reader-${NAMESPACE}
        namespace: wva-policy
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: wva-policy-reader
      subjects:
      - kind: ServiceAccount
        name: wva-controller-manager
        namespace: ${NAMESPACE}
      EOF
      kubectl -n ${NAMESPACE} rollout restart deploy/wva-controller-manager

verify:
  no_cluster_install:
    note: List every controller. A line without --watch-namespace in ARGS is cluster-scoped.
    run: |
      kubectl get deploy -A -l app.kubernetes.io/name=workload-variant-autoscaler,control-plane=controller-manager \
        -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,ARGS:.spec.template.spec.containers[0].args
  objects:
    note: Show this install's ServiceMonitor and hashed cluster RBAC (shasum -a 256 on macOS).
    run: |
      kubectl get servicemonitor -n ${NAMESPACE}
      kubectl get clusterrole,clusterrolebinding | grep "$(printf '%s' "${NAMESPACE}" | sha256sum | cut -c1-8)"

cleanup:
  undo:
    run: make undeploy-wva WVA_NS=${NAMESPACE}
  out_of_reach:
    run: make undeploy-wva WVA_NS=wva-${NAMESPACE}
