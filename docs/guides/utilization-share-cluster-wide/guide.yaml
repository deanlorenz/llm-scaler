name: utilization-share-cluster-wide

steps:
  tools:
    note: Prints nothing when every tool is there.
    run: |
      for t in kubectl helm git jq yq make openssl; do command -v $t >/dev/null || echo "missing: $t"; done
  admin:
    note: Prints yes for a cluster admin.
    run: |
      kubectl auth can-i '*' '*' --all-namespaces
  pools:
    note: One InferencePool in each model namespace.
    run: |
      kubectl get inferencepools -A
  gpus:
    note: The GPU product of each node, and the GPUs each model pod asks for.
    run: |
      kubectl get nodes -L nvidia.com/gpu.product
      kubectl get pods -A -l 'llm-d.ai/role in (decode,prefill)' \
        -o custom-columns='NAMESPACE:.metadata.namespace,POD:.metadata.name,GPUS:.spec.containers[*].resources.limits.nvidia\.com/gpu,NODE:.spec.nodeName'
  keda:
    note: Is KEDA installed? NotFound means no.
    run: |
      kubectl get crd scaledobjects.keda.sh
  check:
    note: Read-only. Checks the tools, your rights, KEDA, Prometheus, and every namespace that runs llm-d.
    run: |
      make check-prereqs SCOPE=cluster
  checknokeda:
    note: The same check, on a cluster with no KEDA yet.
    run: |
      make check-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true
  plan:
    note: Read-only. Lists the model servers and writes a plan. Applies nothing.
    run: |
      make scaledobjects-plan SCOPE=cluster WVA_DEFAULT_SO_PLAN=share-plan.yaml
  workloads:
    note: Read-only. Checks that each model server can be scaled safely. Applies nothing.
    run: |
      make workload-patch SCOPE=cluster
  setup:
    note: Cluster admin, once. Uses the KEDA the cluster already has.
    run: |
      make setup-prereqs SCOPE=cluster
  setupkeda:
    note: The same, on a cluster with no KEDA. Also installs KEDA.
    run: |
      make setup-prereqs SCOPE=cluster KEDA_HELM_INSTALL=true
  vars:
    note: The GPU product the models run on, and how many of its GPUs they may hold together.
    run: |
      export ACCELERATOR=<gpu product>
      export GPUS=<gpus>
  install:
    note: The scaling manager, with one GPU budget for every namespace.
    run: |
      make deploy-wva SCOPE=cluster INSTALL_PHASE=wva \
        WVA_LIMITER=quota WVA_QUOTA_SCOPE=cluster WVA_QUOTAS="${ACCELERATOR}=${GPUS}"
  installphysical:
    note: The same, with the cluster's free GPUs as the budget instead of a number.
    run: |
      make deploy-wva SCOPE=cluster INSTALL_PHASE=wva WVA_LIMITER=gpu-inventory
  register:
    note: "Edit share-plan.yaml first: set maxReplicas so the models together can want more than the budget."
    run: |
      make scaledobjects-apply SCOPE=cluster WVA_DEFAULT_SO_PLAN=share-plan.yaml
  budget:
    note: Name one model namespace and the controller's, then check the budget.
    run: |
      export NAMESPACE=<one model namespace>
      export CONTROLLER_NAMESPACE=workload-variant-autoscaler-system
      make utilization-share-check
  shadow:
    note: Shadow. It reports what it would move, and moves nothing.
    run: |
      make utilization-share-shadow
  shadowphysical:
    note: Shadow, when the budget is the cluster's GPUs.
    run: |
      make utilization-share-shadow PHYSICAL_GROUPS=true
  status:
    note: The mode and the recent decisions, for one model namespace.
    run: |
      make utilization-share-status NAMESPACE=<model namespace>
  activate:
    note: Let it act in every namespace that shares the budget.
    run: |
      make utilization-share-activate GRANT_SHARED=true
  events:
    note: GPUs moving between namespaces, oldest first.
    run: |
      kubectl get events -A --sort-by=.lastTimestamp | grep UtilizationShare
  log:
    note: The optimizer's decisions, from the controller's log.
    run: |
      kubectl logs -n ${CONTROLLER_NAMESPACE} deploy/wva-controller-manager --tail=-1 \
        | grep -E 'Utilization share: (would rebalance|rebalancing|transfer (started|ended|cancelled)|released, raising the receiver)'
  metrics:
    note: The optimizer's metrics, read from the controller.
    run: |
      TOKEN=$(kubectl get secret wva-epp-metrics-token -n ${CONTROLLER_NAMESPACE} -o jsonpath='{.data.token}' | base64 -d)
      kubectl port-forward -n ${CONTROLLER_NAMESPACE} svc/wva-controller-manager-metrics-service 8443:8443 >/dev/null & PF=$!
      sleep 2
      curl -sSfk -H "Authorization: Bearer $TOKEN" https://localhost:8443/metrics \
        | grep -E '^wva_utilization_share_(mode|spare_gpus|headroom|replicas_to_move|transfers_total)'
      kill $PF
  disable:
    note: Turn the optimizer off. The budget stays.
    run: |
      make utilization-share-off
  uninstall:
    note: Remove the scaling manager. The models keep serving; KEDA and Prometheus stay.
    run: |
      make undeploy-wva SCOPE=cluster
