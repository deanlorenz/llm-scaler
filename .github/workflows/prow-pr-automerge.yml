name: Prow Auto-merge
on:
  schedule:
    - cron: "*/5 * * * *"

# Read-only, stated rather than inherited. This job runs every 5 minutes code
# from another organization's repository, so it must not quietly pick up a
# broader default if the repository setting ever changes. The repository
# default is already read, so this is the token it has always had -- which
# means it cannot merge. Granting `contents: write` + `pull-requests: write`
# would turn auto-merge on for every PR carrying `lgtm`; that is a decision
# for a maintainer, not a side effect of a hardening pass.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  auto-merge:
    uses: llm-d/llm-d-infra/.github/workflows/reusable-prow-automerge.yaml@49a41ad0160a60f8838f541173ecc4ff87bc2632 # main as of 2026-10-12
