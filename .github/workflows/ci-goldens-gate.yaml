name: CI - Goldens Gate

# Fails a pull request that moves a golden and does not name it in its goldens:
# section (docs/proposals/analyzer-learner.md 2.5).
#
# A workflow of its own, because it needs the `edited` event, so that correcting
# the section re-runs it. ci-pr-checks.yaml must not take that event: every edit
# of a title or body would start the e2e jobs again, and cancel the ones running.
#
# The body comes from the API, in the job, not from the event. A rerun replays the
# event's saved payload, so a body read from it stays the body of the first run: a
# push that ran before its body was updated left a red no rerun could clear. Read
# here, a rerun reads the body as it is now. A fork's PR gets the same read: its
# token is read-only, and that is enough to read a PR of a public repository.
#
# The body is untrusted. pull_request, never pull_request_target, so a fork's PR
# runs with a read-only token and no secrets. The body reaches the script in a
# file outside the checkout: an expression inside `run:` is pasted into the
# shell's text. The token sits on the one step that reads the body, and that step
# runs before the checkout, so the script from the PR never holds it.
# hack/check-goldens-section.sh, run by `make lint-deploy-scripts`, holds this
# file to all of that.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
      - dev
      # Patch lines (release-0.10): a fix to one is checked like a fix to main.
      - 'release-*'

concurrency:
  group: ci-goldens-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  goldens-section:
    runs-on: ubuntu-latest
    steps:
      # A failed read fails the job here, so it cannot pass as an empty body.
      - name: Read the live pull request body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' >"$PR_BODY_FILE"

      # The merge commit GitHub makes for the PR, and its first parent, the base.
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the goldens section
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: bash deploy/ci-pr-checks/goldens-section.sh HEAD^1 HEAD
