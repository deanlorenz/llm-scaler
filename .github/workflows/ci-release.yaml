name: CI - Release - Docker Container Image

on:
  push:
    tags:
      - 'v*'  # Runs when a tag like v0.1.0 is pushed
  release:
    types: [published]  # Also runs when a GitHub release is published

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set project name from repository
        id: version
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          echo "project_name=$repo" >> "$GITHUB_OUTPUT"

      - name: Print project name
        run: echo "Project is ${{ steps.version.outputs.project_name }}"

      - name: Determine tag name
        id: tag
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "tag=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # A release must install the image it releases. config/base/manager/
      # kustomization.yaml otherwise names :main, a floating tag, so the release's
      # own `kubectl apply -k` would deploy whatever main was last -- not this
      # build, and a different binary next week. Checked before anything is
      # pushed, so a forgotten pin costs a re-tag rather than a published image
      # whose manifests do not use it. See docs/developer-guide/release-process.md.
      - name: Verify the kustomization pins this release
        if: steps.tag.outputs.tag != 'latest'
        run: |
          want="${{ steps.tag.outputs.tag }}"
          have="$(awk '$1 == "newTag:" {print $2}' config/base/manager/kustomization.yaml | tr -d '"')"
          if [ "$have" != "$want" ]; then
            echo "::error file=config/base/manager/kustomization.yaml::newTag is '${have}', expected '${want}'. Pin the release tag on the tagged commit (release-process.md, step 2)."
            exit 1
          fi
          echo "kustomization newTag: ${have}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push multi-arch image
        id: build
        run: |
          # The repository owner, as ci-main-image does: the kustomization and
          # the installer both pull from ghcr.io/<owner>/<repo>, and a release
          # pushed anywhere else is one no install of this tree can find.
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ steps.version.outputs.project_name }}
          VERSION_TAG=${{ steps.tag.outputs.tag }}
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE with tags $VERSION_TAG and latest for linux/amd64 and linux/arm64"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Workload Variant Autoscaler (WVA) - GPU-aware autoscaler for LLM inference workloads" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            -t $IMAGE:$VERSION_TAG \
            -t $IMAGE:latest .

      - name: Run Trivy scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ steps.build.outputs.image }}:${{ steps.tag.outputs.tag }}
