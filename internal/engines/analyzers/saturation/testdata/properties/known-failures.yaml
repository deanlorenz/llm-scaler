# Known failures of the learner property tests (docs/proposals/analyzer-learner.md, 2.6).
#
# Each row is a property case that fails on today's code, and the violation
# kind it fails with (expect). TestLearnerProperties requires a listed case to
# fail with that kind: failing with another kind is a new failure, and passing
# on every seed breaks the build until the row is removed. A row naming no
# case is an error. A PR that fixes a row removes it; one that changes a case
# or its generator restates measured. Nothing here is skipped, and no
# tolerance is widened to pass a defect.
#
# id is class/learner/case, as the test names it; rows are sorted by id.
# measured is the fail rate over the case's seeds and the first failure, when
# the row was written. owner is what clears the row: an issue ("#394"), or
# "open". CheckLedger holds that form only, so a closed issue passes.
- id: edges/mu/sibling-tolerance-excursion
  class: edges
  learner: mu
  expect: flipped
  finding: "The weighing (weighUnreadReplicas) switches the sample's source on read < siblingMuTolerance x h with no band: a queued reader whose rate over its unread siblings ramps 0.95 -> 0.65 under the measured rate noise (sigma 10 %, lag-one 0.3) changes source on most minutes near the crossing, and each change moves the sample by 3/4 of (h - read), about 0.15h at the tolerance, upward as the reader falls."
  measured: "20/20 seeds; seed 1: 21 reversals in 168 cycles, first at cycles 16, 17, 32, 36; the sample stepped 1.010 -> 0.918 of h at the first"
  owner: "#495"
- id: edges/mu/sibling-tolerance-excursion-sigma15
  class: edges
  learner: mu
  expect: flipped
  finding: "The weighing's unbanded tolerance at the high end of the measured rate noise (sigma 15 %, lag-one 0.3): the sample's source changes from the first minutes of the ramp, while the noise-free reader is still at 0.93 of h."
  measured: "20/20 seeds; seed 1: 29 reversals in 168 cycles, first at cycles 16, 17, 28, 30; the sample stepped 1.047 -> 0.887 of h at the first"
  owner: "#495"
- id: edges/shape-hold/tolerance-excursion-stress
  class: edges
  learner: shape-hold
  expect: flipped
  finding: "Under assumed stress noise on the output length (4 %, phi 0.9; E1 measures 0.5-0.9 %, where the main case passes) the shape tracker, which moves its anchor and the key on one reading past 20 % and anchors on that reading, is moved a second time by one tail reading and back by the next."
  measured: "5/1000 seeds (64, 247, 407, 901, 926); seed 64, down to 775: 1000 -> 792 at cycle 91 -> 630 at 171 -> 765 at 185"
  owner: "#495"
- id: first-sample/mu/joiner-rate-timebase
  class: first-sample
  learner: mu
  expect: adopted-raw
  finding: "On the time base, a replica's first saturated rate[1m] covers only the part of the minute it served. Served for half the minute or more, the reading is at least half the derived mu and passes minMeasuredOfDerived, so a second reading moves the figure by up to half. The joined test refuses this for a replica Ready under a minute, not for one routed to late. Measured on throughputRefusal alone, so an upper bound: the analyzer's full path also applies tokensOutrunCompletions and the served bound, which may refuse some of these readings."
  measured: "51/100 seeds; seed 3: served 30 s of its first minute, rate[1m] 0.1095 against a derived 0.2118, admitted"
  owner: "#392"
- id: liveness/floor/closed-loop-decode-step-start-463s
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step from 2.5 to 12 req/s (need 17), with no restart, holds 22 replicas until 36.5 min and ends at 21, over the bound at the 40 min horizon (#520)."
  measured: "1/1 seed (the probe draws nothing from it); starting replicas shown: peak 22 (ceiling 26.5), 22 from 15.25 min, 21 from 36.5 min against the 20.5 bound, never under need"
  owner: "#520"
- id: liveness/floor/closed-loop-load-step-start-463s
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the aggregated load step from 1.2 to 6 req/s (need 9) overshoots to 16 replicas, over the 14.5 ceiling, and ends at 11, 0.35 replica inside the bound; showing the starting replicas does not change it (#520)."
  measured: "1/1 seed; starting replicas shown: peak 16 at 15.25 min, final 11 (bound 11.35), under need 8m0s (bound 11m13s)"
  owner: "#520"
- id: liveness/floor/closed-loop-restart-before-step-start-463s
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step after a controller restart, with no mu yet, overshoots to 29 replicas and ends at 23, over the bound at the 40 min horizon; showing the starting replicas does not change it (#520)."
  measured: "1/1 seed; starting replicas shown: peak 29 against the 26.5 ceiling, final 23 against the 20.5 bound, under need 8m0s (bound 11m13s)"
  owner: "#520"
- id: liveness/floor/closed-loop-restored-snapshot-start-463s
  class: liveness
  learner: floor
  expect: over-priced
  finding: "At a 463 s start the decode step through a restored snapshot holds 22 replicas until 36.5 min and ends at 21, over the bound at the 40 min horizon, the same trace as with no restart (#520)."
  measured: "1/1 seed; starting replicas shown: peak 22 (ceiling 26.5), 21 from 36.5 min against the 20.5 bound, never under need"
  owner: "#520"
- id: liveness/k2/flow-control-on
  class: liveness
  learner: k2
  expect: not-learned
  finding: "k2 is learned only from an engine queue at or over the threshold. Under flow control the queue stands at the scheduler and the engines' own queues read empty, so P1-obs never fires and the variant prices from k1. Here the true capacity is above k1, so a learned k2 could not move capacity: what the row measures is the mu written beside a P1-obs reading, which flow control leaves unwritten. The under-provisioning when a fleet is sequence-bound is #399."
  measured: "20/20 seeds; two decode replicas full for 3 min with 40 requests at the scheduler: no k2"
  owner: "#394"
- id: n-dependence/prefill-bound/iid-max
  class: n-dependence
  learner: prefill-bound
  expect: n-dependent
  finding: "The prefill bound is a running max over time by design, so under iid noise it reads high even with one pod. Pods within a minute fold by their mean (#395), so the bias now falls as N grows (E 1.153 at N=1, 1.036 at N=16, seed 1, 200 trials); what is left is the max over minutes (#397). The case drives the production notePrefillBound."
  measured: "10/10 seeds; seed 1: E at N=1 is 1.160 against a true 1, +16.0 %"
  owner: "#397"
