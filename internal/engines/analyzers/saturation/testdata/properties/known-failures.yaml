  finding: "At a 463 s start the decode step from 2.5 to 12 req/s (need 17), with no restart, holds 22 replicas until 36.5 min and ends at 21, over the bound even at the backlog allowance (44m15s). On the even split, which keeps feeding the first replicas their start's queue, it drains at mu less their share (#520)."
